[project]
name = "laptop-price-predictor"
version = "0.1.0"
description = "Machine learning pipeline and API microservice for estimating laptop market prices from technical hardware specifications."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Yog Damahe", email = "yogdamahe@gmail.com"}
]

dependencies = [
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    "matplotlib>=3.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "joblib>=1.4.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "jupyter>=1.1.0",
    "nbformat>=5.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0"
]
streamlit = [
    "streamlit>=1.39.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
